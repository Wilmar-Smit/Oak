[lints.rust]
non_snake_case = "allow"

[lints.clippy]

implicit_clone = "deny"
unwrap_used = "warn"
needless_return = "allow"
wildcard_imports = "allow"

[package]
name = "oak"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.35"
pollster = "1.0.1"
pretty_assertions = "1.4.1"
softbuffer = "0.4.8"
wgpu = "30.0"
winit = { version = "0.30.13", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "rwh_06",
] }
