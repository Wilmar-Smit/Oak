output:
  - meta
  - summary
  - success
  - failure
  - execution
  - execution_out
  - execution_info

pre-commit:
  parallel: true
  commands:
    format:
      run: just format

commit-msg:
  commands:
    commit-check:
      run: 'grep -E "^(feat|fix|docs|style|refactor|test|chore)(\([a-zA-Z0-9_.-]+\))?!?(: .*)?$" {1}'
      fail_text: "❌ Invalid commit message format! Example: 'feat(scope)' or 'feat(scope): message'"

pre-push:
  commands:
    unit-test:
      run: just test
    lint:
      run: just lint
